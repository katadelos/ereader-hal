[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ereader-hal"
version = "0.5.0"
license = {text = "MIT"}
description = "Python bindings for the Kindle and Kobo hardware abstraction library"
requires-python = ">=3.14"

[tool.setuptools]
packages = ["ereader_hal"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
